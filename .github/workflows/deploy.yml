name: Deploy Website SMAN 15 Malinau

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instal dependensi
        run: npm install

      - name: Build website
        run: npm run build

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publikasikan website
        id: deployment
        uses: actions/deploy-pages@v4
